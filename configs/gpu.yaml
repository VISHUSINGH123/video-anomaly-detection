# GPU-Optimized Configuration (NVIDIA CUDA or DirectML where supported)
experiment_name: "vad_multiprior_gpu"
seed: 42
device: "cuda"

data:
  dataset_name: "ucsd_ped2"
  raw_video_dir: "data/raw"
  processed_feature_dir: "data/processed"
  annotations_dir: "data/annotations"
  clip_length: 16
  clip_stride: 4 # Dense temporal sliding windows on GPU
  target_fps: null
  short_video_policy: "pad"

encoders:
  videomae:
    enabled: true
    model_name: "MCG-NJU/videomae-base"
    feature_dim: 768
    num_frames: 16
    image_size: 224
    batch_size: 16
    pooling: "mean"
    use_fp16: true
    local_files_only: false
  dinov2:
    enabled: true
    model_name: "facebook/dinov2-base"
    feature_dim: 768
    image_size: 224
    frame_sample_rate: 1 # Process every frame on GPU
    batch_size: 64
    pooling: "cls"
    use_fp16: true
    local_files_only: false

temporal:
  enabled: true
  hidden_dim: 256
  num_layers: 4
  kernel_size: 3
  dilation_base: 2
  dropout: 0.2
  causal: false

fusion:
  mode: "gated_multiprior"
  proj_dim: 256
  dropout: 0.2
  include_motion_prior: true
  temperature: 1.0

training:
  supervision: "supervised_clip"
  epochs: 50
  batch_size: 16
  learning_rate: 0.0005
  weight_decay: 0.0001
  pos_weight: 2.0
  smoothness_lambda: 0.05
  sparsity_lambda: 0.005
  mil_topk_ratio: 0.15
  early_stopping_patience: 10
  checkpoint_dir: "checkpoints"

evaluation:
  threshold: 0.5
  smoothing_window: 3
  output_dir: "outputs/evaluation"

inference:
  window_length: 16
  window_stride: 4
  smoothing_window: 3
  threshold: 0.5
  output_dir: "outputs/predictions"
